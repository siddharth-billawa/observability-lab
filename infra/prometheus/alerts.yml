groups:
  - name: application
    rules:
      - alert: ElevatedServerErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.01) > 0.10) and (sum(rate(http_server_requests_seconds_count[5m])) > 0.2)
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Server errors exceed 10% for two minutes
          description: Investigate recent failures in Grafana Explore and Jaeger.
      - alert: ApplicationUnavailable
        expr: up{job=~"order-service|payment-service"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: An application scrape target is unavailable}
