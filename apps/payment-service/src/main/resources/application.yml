spring:
  application.name: payment-service
server.port: ${SERVER_PORT:8081}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.distribution.percentiles-histogram.http.server.requests: true
  tracing.sampling.probability: 1.0
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp.metrics.export.enabled: false
  observations.key-values.service: payment-service
logging.structured.format.console: logstash
demo.payment.delay-ms: ${PAYMENT_DELAY_MS:0}
demo.payment.fail: ${PAYMENT_FAIL:false}

demo.enabled: ${DEMO_ENABLED:false}
logging.structured.json.add.service: payment-service
logging.structured.json.add.environment: ${APP_ENV:local}
