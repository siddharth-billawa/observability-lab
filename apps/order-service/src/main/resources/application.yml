spring:
  application.name: order-service
  datasource:
    hikari.connection-timeout: 3000
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/observability}
    username: ${SPRING_DATASOURCE_USERNAME:lab}
    password: ${SPRING_DATASOURCE_PASSWORD:lab}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  threads.virtual.enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.distribution.percentiles-histogram:
    http.server.requests: true
    orders.processing: true
  tracing.sampling.probability: 1.0
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp.metrics.export.enabled: false
  observations.key-values.service: order-service
logging.structured.format.console: logstash
payment.base-url: ${PAYMENT_BASE_URL:http://localhost:8081}

demo.enabled: ${DEMO_ENABLED:false}
logging.structured.json.add.service: order-service
logging.structured.json.add.environment: ${APP_ENV:local}
